<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selah Alma Bonita</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Música Selah -->
<div class="musica">
    <button id="btnMusica">🎵</button>

    <audio id="musicaSelah" loop>
        <source src="audio/musica-selah.mp3" type="audio/mpeg">
    </audio>
</div>


<div class="contenedor">

<img src="logo.png" alt="Selah Alma Bonita" class="logo">

<h1>
Selah
<span>Alma Bonita</span>
</h1>

<p class="frase">
Detente, respira, sana y florece
</p>


<div class="tarjeta">

<h2>🌸 Bienvenida</h2>

<p class="saludo">
Nos llena de alegría recibirte.
</p>


<div class="cita">

<h3>Tu próxima cita</h3>

<p id="fechaCita">📅 Fecha de tu cita</p>

<p id="horaCita">🕙 Hora de tu cita</p>

<p id="duracionCita">⏱️ Duración: 60 minutos</p>

</div>

</div>


<div class="mensaje">

✨ Hoy elegiste regalarte un momento para ti.

</div>


<div class="botones">

<button id="btnMapa">
📍 Cómo llegar
</button>

<button id="btnWhatsApp">
💬 Confirmar asistencia
</button>

<button id="btnCalendario">
📅 Agregar a mi calendario
</button>

<button id="btnPago">
💳 Formas de pago
</button>

<button id="btnResena">
⭐ Compartir mi experiencia
</button>

</div>


<div id="pagoBox" class="oculta"></div>


</div>


<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
